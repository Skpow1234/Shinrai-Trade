[workspace]
resolver = "2"
members = [
    "crates/domain/money",
    "crates/domain/instruments",
    "crates/domain/ledger",
    "crates/domain/orders",
    "crates/domain/market-data",
    "crates/protocols/market-data",
    "crates/protocols/md-fanout",
    "crates/testing/exchange-simulator",
    "crates/domain/paper",
    "crates/services/market-data-gateway",
]
default-members = [
    "crates/domain/money",
    "crates/domain/instruments",
    "crates/domain/ledger",
    "crates/domain/orders",
    "crates/domain/market-data",
    "crates/protocols/market-data",
    "crates/protocols/md-fanout",
    "crates/testing/exchange-simulator",
    "crates/domain/paper",
    "crates/services/market-data-gateway",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
shinrai-money = { path = "crates/domain/money", version = "0.1.0" }
shinrai-instruments = { path = "crates/domain/instruments", version = "0.1.0" }
shinrai-ledger = { path = "crates/domain/ledger", version = "0.1.0" }
shinrai-orders = { path = "crates/domain/orders", version = "0.1.0" }
shinrai-market-data = { path = "crates/domain/market-data", version = "0.1.0" }
shinrai-md-protocol = { path = "crates/protocols/market-data", version = "0.1.0" }
shinrai-md-fanout = { path = "crates/protocols/md-fanout", version = "0.1.0" }
shinrai-exchange-simulator = { path = "crates/testing/exchange-simulator", version = "0.1.0" }
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
] }
axum = { version = "0.8", features = ["ws"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
