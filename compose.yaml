# Dev / local stack for Shinrai-Trade.
#
# Create secrets once (files are gitignored):
#   ./deploy/scripts/init-secrets.sh
#   .\deploy\scripts\init-secrets.ps1
#
# Dependencies only:
#   docker compose up -d postgres
#   docker compose up -d postgres nats
#
# Full paper stack (build Rust binaries — first build is slow):
#   docker compose --profile full up -d --build
#
#   MD:  http://127.0.0.1:8080/health
#   OG:  http://127.0.0.1:8081/ui   (token: full-dev)
#   Ops: bearer from deploy/secrets/ops_token (default compose-ops)
#
# TLS termination (Caddy, self-signed local CA):
#   docker compose --profile full --profile tls \
#     -f compose.yaml -f compose.tls.yaml up -d --build
#   → https://og.localhost/ui  ·  https://md.localhost/health
#
# Tear down:
#   docker compose --profile full --profile tls -f compose.yaml -f compose.tls.yaml down
#   docker compose down -v

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
  ops_token:
    file: ./deploy/secrets/ops_token

services:
  postgres:
    image: postgres:16-alpine
    container_name: shinrai-postgres
    environment:
      POSTGRES_USER: shinrai
      POSTGRES_DB: shinrai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - shinrai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinrai -d shinrai"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: shinrai-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  md-gateway:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: md-gateway
    image: shinrai-md-gateway:local
    container_name: shinrai-md-gateway
    environment:
      SHINRAI_MD_BIND: "0.0.0.0:8080"
      SHINRAI_MD_CLIENTS: "dev:s3cret:alice"
      SHINRAI_MD_TOKENS: "dev:alice"
      SHINRAI_MD_SYNTH: "1"
    ports:
      - "8080:8080"
    restart: unless-stopped

  order-gateway:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: order-gateway
    image: shinrai-order-gateway:local
    container_name: shinrai-order-gateway
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      md-gateway:
        condition: service_healthy
    secrets:
      - postgres_password
      - ops_token
    environment:
      SHINRAI_OG_BIND: "0.0.0.0:8081"
      # Built by entrypoint from /run/secrets/postgres_password when URL unset.
      SHINRAI_DATABASE_HOST: "postgres"
      SHINRAI_DATABASE_USER: "shinrai"
      SHINRAI_DATABASE_NAME: "shinrai"
      SHINRAI_RUN_MIGRATIONS: "1"
      SHINRAI_OG_TOKENS: "full-dev:trader"
      SHINRAI_OG_CLIENTS: "dev:s3cret:trader"
      SHINRAI_OG_ACCOUNTS: "trader:1"
      SHINRAI_OG_DEPOSITS: "1:10000"
      SHINRAI_OG_MARKS: "AAPL:10000"
      SHINRAI_OG_MD_URL: "http://md-gateway:8080"
      SHINRAI_OG_MD_TOKEN: "dev"
      SHINRAI_OG_OPS_ALLOWLIST: "*"
      SHINRAI_NATS_URL: "nats://nats:4222"
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  shinrai_pg:
    name: shinrai_pg
