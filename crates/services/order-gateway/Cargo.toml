[package]
name = "shinrai-order-gateway"
description = "HTTP order gateway: auth, pre-trade risk, paper trading"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shinrai-exchange-simulator = { workspace = true }
shinrai-instruments = { workspace = true }
shinrai-ledger = { workspace = true }
shinrai-md-fanout = { workspace = true }
shinrai-audit = { workspace = true }
shinrai-money = { workspace = true }
shinrai-orders = { workspace = true }
shinrai-paper = { workspace = true }
shinrai-portfolio = { workspace = true }
shinrai-risk = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
shinrai-md-gateway = { path = "../market-data-gateway" }
tower = { version = "0.5", features = ["util"] }
