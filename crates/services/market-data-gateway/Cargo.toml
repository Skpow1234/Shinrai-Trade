[package]
name = "shinrai-md-gateway"
description = "HTTP/WebSocket market-data gateway: auth on connect, bounded fanout"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shinrai-instruments = { workspace = true }
shinrai-market-data = { workspace = true }
shinrai-md-fanout = { workspace = true }
shinrai-md-protocol = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
