name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: "1"
  # Keep in sync with rust-toolchain.toml (dtolnay/rust-toolchain@master requires an explicit input).
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: ${{ env.RUST_TOOLCHAIN }}

  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Test workspace
        run: cargo test --workspace --all-features --locked

  test-db:
    name: test-db (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shinrai
          POSTGRES_PASSWORD: shinrai
          POSTGRES_DB: shinrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shinrai -d shinrai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      SHINRAI_DATABASE_URL: postgres://shinrai:shinrai@127.0.0.1:5432/shinrai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-db
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Store integration tests
        run: cargo test -p shinrai-store --all-features --locked -- --nocapture
      - name: Order-gateway dual-write tests
        run: >-
          cargo test -p shinrai-order-gateway --all-features --locked
          --test dual_write -- --nocapture --test-threads=1
      - name: Order-gateway chaos / durability tests
        run: >-
          cargo test -p shinrai-order-gateway --all-features --locked
          --test chaos -- --nocapture --test-threads=1

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # GHA BuildKit cache (type=gha)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build order-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: order-gateway
          tags: shinrai-order-gateway:ci
          cache-from: type=gha,scope=order-gateway
          cache-to: type=gha,mode=max,scope=order-gateway
      - name: Build md-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: md-gateway
          tags: shinrai-md-gateway:ci
          cache-from: type=gha,scope=md-gateway
          cache-to: type=gha,mode=max,scope=md-gateway

  build:
    name: build (release gateways)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Build release gateways
        run: >-
          cargo build --locked --release
          -p shinrai-md-gateway -p shinrai-order-gateway

  # Single required check for branch protection.
  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, deny, test, test-db, docker, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs green
        run: |
          set -euo pipefail
          ok=1
          for pair in \
            "fmt=${{ needs.fmt.result }}" \
            "clippy=${{ needs.clippy.result }}" \
            "deny=${{ needs.deny.result }}" \
            "test=${{ needs.test.result }}" \
            "test-db=${{ needs.test-db.result }}" \
            "docker=${{ needs.docker.result }}" \
            "build=${{ needs.build.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name → $result"
            if [ "$result" != "success" ]; then
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
